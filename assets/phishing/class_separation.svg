<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 262" width="704" height="262" role="img" aria-labelledby="t d">
<title id="t">Class separation on era controls against modern mail</title>
<desc id="d">A probability axis from zero to one with the 0.5 decision threshold marked. On era controls the mean prediction for legitimate mail is 0.048 and for phishing 0.894, a separation of 0.847 that places both classes far from the threshold. On modern mail the means are 0.273 and 0.590, a separation of 0.317, and both sit close to the threshold.</desc>

<style>
  .lbl  { font: 500 11px "Space Grotesk", system-ui, sans-serif; fill: #182635; }
  .sub  { font: 400 9px "IBM Plex Mono", ui-monospace, monospace; fill: #8b94a3; }
  .tick { font: 400 9px "IBM Plex Mono", ui-monospace, monospace; fill: #8b94a3; }
  .val  { font: 500 9.5px "IBM Plex Mono", ui-monospace, monospace; fill: #182635; }
  .sep  { font: 500 10px "IBM Plex Mono", ui-monospace, monospace; fill: #b96a1e; }
  .axis { stroke: #dcdfe2; stroke-width: 1; }
  .thr  { stroke: #b96a1e; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .span { stroke: #8b94a3; stroke-width: 2; }
</style>

<!-- threshold -->
<line class="thr" x1="397" y1="42" x2="397" y2="206"/>
<text class="sep" x="397" y="34" text-anchor="middle">decision threshold 0.5</text>

<!-- ── era controls ── -->
<text class="lbl" x="20" y="82">Era controls</text>
<text class="sub" x="20" y="96">n = 6</text>
<line class="span" x1="155.6" y1="84" x2="607.4" y2="84"/>
<circle cx="155.6" cy="84" r="6" fill="#1f3864"/>
<circle cx="607.4" cy="84" r="6" fill="#b96a1e"/>
<text class="val" x="155.6" y="70" text-anchor="middle">0.048</text>
<text class="val" x="607.4" y="70" text-anchor="middle">0.894</text>
<text class="sep" x="381.5" y="104" text-anchor="middle">separation 0.847</text>

<!-- ── modern register ── -->
<text class="lbl" x="20" y="158">Modern register</text>
<text class="sub" x="20" y="172">n = 24</text>
<line class="span" x1="275.8" y1="160" x2="445.1" y2="160"/>
<circle cx="275.8" cy="160" r="6" fill="#1f3864"/>
<circle cx="445.1" cy="160" r="6" fill="#b96a1e"/>
<text class="val" x="275.8" y="146" text-anchor="middle">0.273</text>
<text class="val" x="445.1" y="146" text-anchor="middle">0.590</text>
<text class="sep" x="360.5" y="180" text-anchor="middle">separation 0.317</text>

<!-- ── axis ── -->
<line class="axis" x1="130" y1="206" x2="664" y2="206"/>
<g class="tick" text-anchor="middle">
  <line class="axis" x1="130" y1="206" x2="130" y2="211"/><text x="130" y="224">0</text>
  <line class="axis" x1="263.5" y1="206" x2="263.5" y2="211"/><text x="263.5" y="224">0.25</text>
  <line class="axis" x1="397" y1="206" x2="397" y2="211"/><text x="397" y="224">0.50</text>
  <line class="axis" x1="530.5" y1="206" x2="530.5" y2="211"/><text x="530.5" y="224">0.75</text>
  <line class="axis" x1="664" y1="206" x2="664" y2="211"/><text x="664" y="224">1.0</text>
</g>
<text class="sub" x="397" y="242" text-anchor="middle">mean predicted probability of phishing</text>

<!-- legend -->
<circle cx="150" cy="252" r="5" fill="#1f3864"/>
<text class="sub" x="162" y="256">legitimate</text>
<circle cx="245" cy="252" r="5" fill="#b96a1e"/>
<text class="sub" x="257" y="256">phishing</text>
</svg>
